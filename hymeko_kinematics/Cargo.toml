[package]
name = "hymeko_kinematics"
version = "0.1.0"
edition = "2024"
description = "Kinematic models and their computations without IR: forward/inverse kinematics, DH chains, joint playout, two-bone limbs, collision geometry."
license = "MIT"

# The public revisions every framework consumer pins, so a workspace that uses several of them
# resolves one crate identity per dependency.
[dependencies]
# SE(n) rigid motions: the Tensor pillar's geometric algebra.
hymeko_clifford = { git = "https://github.com/hymeko-framework/tensor.git", rev = "2b0c18523e977d36691af2738bb8f4feabd8dc4b", optional = true }
# Dense f64 kernels (damped least squares) for inverse kinematics.
hymeko_tensor = { git = "https://github.com/hymeko-framework/tensor.git", rev = "2b0c18523e977d36691af2738bb8f4feabd8dc4b", optional = true }
# Hermite joint playout.
hymeko_spline = { git = "https://github.com/hymeko-framework/tensor.git", rev = "2b0c18523e977d36691af2738bb8f4feabd8dc4b", optional = true }
# Spatial candidate search belongs to Graph SBSH; no second partition here.
hymeko_sbsh = { git = "https://github.com/hymeko-framework/graph.git", rev = "31f0bfaf2d008fdd15399ec83457b7b54f61b23d", optional = true }

[features]
default = ["model"]
# The kinematic model and everything built on it; two_bone needs none of it.
model = ["dep:hymeko_clifford", "dep:hymeko_tensor", "dep:hymeko_spline", "dep:hymeko_sbsh"]
